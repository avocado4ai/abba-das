<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background is transparent so it blends with the theme -->
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-sage, #7E9983)" stop-opacity="0.4" />
      <stop offset="100%" stop-color="var(--color-sage, #7E9983)" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-navy, #0A2647)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--color-navy, #0A2647)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sun -->
  <circle cx="400" cy="200" r="120" fill="url(#sunGradient)" />
  
  <!-- Back Hill -->
  <path d="M0,400 Q200,150 500,280 T800,200 L800,400 Z" fill="url(#hill1)" />
  
  <!-- Front Hill / Wave -->
  <path d="M-50,400 Q150,250 400,350 T850,280 L850,400 Z" fill="url(#hill2)" />

  <!-- Book Silhouette -->
  <g transform="translate(340, 260) scale(1.5)" stroke="var(--color-navy, #0A2647)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v15H6.5a2.5 2.5 0 0 0 0 5H20" />
    <path d="M6.5 2C4.015 2 2 4.015 2 6.5S4.015 11 6.5 11" opacity="0.3" />
    <!-- Pages lines -->
    <line x1="8" y1="6" x2="16" y2="6" stroke-opacity="0.5" />
    <line x1="8" y1="10" x2="14" y2="10" stroke-opacity="0.5" />
    <line x1="8" y1="14" x2="16" y2="14" stroke-opacity="0.5" />
  </g>

  <!-- Minimal Birds -->
  <g stroke="var(--color-navy, #0A2647)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M200 120 Q210 110 220 120 Q230 110 240 120" />
    <path d="M160 160 Q168 153 176 160 Q184 153 192 160" transform="scale(0.8) translate(30, 20)" />
    <path d="M550 140 Q560 130 570 140 Q580 130 590 140" transform="scale(0.9) translate(60, 10)" />
  </g>
</svg>
