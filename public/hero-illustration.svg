<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>
  </defs>

  <!-- Abstract Morning Vibe -->
  <circle cx="400" cy="450" r="300" fill="#FFD700" opacity="0.1" filter="url(#blur)" />
  <path d="M-100 400Q150 250 400 350T900 300V400H-100Z" fill="#7E9983" opacity="0.15" />
  <path d="M-200 400Q200 150 600 320T1000 200V400H-200Z" fill="#0A2647" opacity="0.05" />

  <!-- Minimalist Artistic Birds -->
  <g stroke="#0A2647" stroke-width="1.2" stroke-linecap="round" opacity="0.4">
    <path d="M150 120Q165 105 180 120" />
    <path d="M180 120Q195 105 210 120" />
    
    <path d="M550 160Q560 150 570 160" transform="translate(20, 10)" />
    <path d="M570 160Q580 150 590 160" transform="translate(20, 10)" />
  </g>

  <!-- Stylized Feather/Quill -->
  <path d="M650 300Q600 150 550 100" stroke="#7E9983" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.3" />
</svg>
