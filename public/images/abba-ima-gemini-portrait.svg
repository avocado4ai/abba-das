<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
    <filter id="soften">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="900" fill="url(#bgGrad)" />
  
  <!-- Artistic Blobs (Beach/Nature Vibe) -->
  <path d="M-100,300 Q200,100 500,350 T1000,200 L1000,0 L-100,0 Z" fill="#A8C5BA" opacity="0.2" filter="url(#soften)" />
  <circle cx="750" cy="150" r="200" fill="url(#sunGrad)" />
  
  <path d="M0,600 Q150,550 300,700 T700,600 L900,800 L900,900 L0,900 Z" fill="#7E9983" opacity="0.1" />
  <path d="M500,900 Q700,700 900,800 L900,900 Z" fill="#C4A572" opacity="0.15" />

  <!-- Main Figures (Stylized) -->
  <g transform="translate(450, 480)">
    <!-- Shadow -->
    <ellipse cx="0" cy="380" rx="300" ry="30" fill="#0A2647" opacity="0.03" />

    <!-- Father (Stylized Silhouette with details) -->
    <g transform="translate(-180, -280)">
      <!-- Shirt -->
      <path d="M40,600 L40,350 Q40,280 120,280 L200,280 Q280,280 280,350 L280,600" fill="#0077CC" opacity="0.9" />
      <!-- Shorts -->
      <path d="M50,600 L270,600 L270,750 Q270,770 240,770 L80,770 Q50,770 50,750 Z" fill="#E5D3B3" />
      <!-- Skin -->
      <path d="M90,120 Q90,50 160,50 Q230,50 230,120 L230,240 Q230,300 160,300 Q90,300 90,240 Z" fill="#FAD7B5" />
      <!-- Hair -->
      <path d="M90,130 Q90,40 160,40 Q230,40 230,130" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8" />
      <!-- Sunglasses -->
      <rect x="110" y="160" width="40" height="20" rx="4" fill="#0A2647" />
      <rect x="170" y="160" width="40" height="20" rx="4" fill="#0A2647" />
      <path d="M150,170 L170,170" stroke="#0A2647" stroke-width="2" />
    </g>

    <!-- Mother (Stylized Silhouette with details) -->
    <g transform="translate(40, -250)">
      <!-- Shirt (Coral) -->
      <path d="M50,580 L50,330 Q50,270 120,270 L200,270 Q270,270 270,330 L270,580" fill="#D97760" opacity="0.9" />
      <!-- Jacket (Light) -->
      <path d="M40,320 Q40,260 120,260 L200,260 Q280,260 280,320 L280,580 L230,580 L220,330 L100,330 L90,580 L40,580 Z" fill="#FBFBFA" />
      <!-- Skin -->
      <path d="M100,120 Q100,50 160,50 Q220,50 220,120 L220,230 Q220,280 160,280 Q100,280 100,230 Z" fill="#FAD7B5" />
      <!-- Hair -->
      <path d="M90,120 Q90,30 160,30 Q230,30 230,120 L230,200 Q230,220 210,220 L110,220 Q90,220 90,200 Z" fill="#6B4423" />
      <!-- Sunglasses -->
      <rect x="115" y="155" width="35" height="25" rx="12" fill="#0A2647" />
      <rect x="170" y="155" width="35" height="25" rx="12" fill="#0A2647" />
      <path d="M150,167 L170,167" stroke="#0A2647" stroke-width="2" />
    </g>
    
    <!-- Arm link (Connection) -->
    <path d="M-20,120 Q30,100 80,120" fill="none" stroke="#FBFBFA" stroke-width="35" stroke-linecap="round" opacity="0.6" transform="translate(0, 150)" />
  </g>
</svg>
