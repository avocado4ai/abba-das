<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--color-navy, #0A2647)" stop-opacity="0.05" />
      <stop offset="50%" stop-color="var(--color-sage, #7E9983)" stop-opacity="0.1" />
      <stop offset="100%" stop-color="var(--color-navy, #0A2647)" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="600" height="200" rx="20" fill="url(#bg)" stroke="var(--color-border-theme, rgba(10,38,71,0.1))" stroke-width="1" />

  <g text-anchor="middle" font-family="var(--font-heebo), sans-serif">
    <!-- Stat 1 -->
    <g transform="translate(150, 100)">
      <circle cx="0" cy="-20" r="30" fill="var(--color-navy, #0A2647)" opacity="0.05" />
      <path d="M-10,-25 L-10,-15 L0,-10 L10,-15 L10,-25 L0,-30 Z" fill="none" stroke="var(--color-navy, #0A2647)" stroke-width="2" />
      <text x="0" y="20" font-size="28" font-weight="bold" fill="var(--color-navy, #0A2647)">+50</text>
      <text x="0" y="45" font-size="14" fill="var(--color-navy, #0A2647)" opacity="0.7">סיפורים שנכתבו</text>
    </g>
    
    <!-- Divider -->
    <line x1="300" y1="40" x2="300" y2="160" stroke="var(--color-border-theme, rgba(10,38,71,0.1))" stroke-width="1" stroke-dasharray="4" />

    <!-- Stat 2 -->
    <g transform="translate(450, 100)">
      <circle cx="0" cy="-20" r="30" fill="var(--color-sage, #7E9983)" opacity="0.1" />
      <circle cx="0" cy="-20" r="12" fill="none" stroke="var(--color-sage, #7E9983)" stroke-width="2" />
      <path d="M0,-25 L0,-20 L5,-20" fill="none" stroke="var(--color-sage, #7E9983)" stroke-width="2" />
      <text x="0" y="20" font-size="28" font-weight="bold" fill="var(--color-sage, #7E9983)">120</text>
      <text x="0" y="45" font-size="14" fill="var(--color-sage, #7E9983)" opacity="0.7">דקות קריאה</text>
    </g>
  </g>
</svg>
