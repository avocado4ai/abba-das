<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
  </defs>

  <rect width="600" height="200" rx="24" fill="#F5F5F1" />
  <path d="M0 150Q150 100 300 150T600 120V200H0Z" fill="#7E9983" opacity="0.1" />
  <circle cx="500" cy="50" r="80" fill="#FFD700" opacity="0.05" filter="url(#softGlow)" />

  <g transform="translate(150, 100)" text-anchor="middle">
    <circle r="40" fill="#0A2647" opacity="0.03" />
    <text y="10" font-size="36" font-weight="bold" fill="#0A2647" font-family="Heebo, sans-serif">+50</text>
    <text y="35" font-size="14" fill="#7E9983" font-family="Heebo, sans-serif" font-weight="500">סיפורים שנכתבו</text>
  </g>

  <path d="M300 50V150" stroke="#0A2647" stroke-width="1" stroke-dasharray="8 8" opacity="0.1" />

  <g transform="translate(450, 100)" text-anchor="middle">
    <circle r="40" fill="#7E9983" opacity="0.05" />
    <text y="10" font-size="36" font-weight="bold" fill="#7E9983" font-family="Heebo, sans-serif">120</text>
    <text y="35" font-size="14" fill="#0A2647" font-family="Heebo, sans-serif" opacity="0.6" font-weight="500">דקות קריאה</text>
  </g>
</svg>
