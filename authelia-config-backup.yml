---
# Authelia Configuration File
theme: light

server:
  address: 'tcp://0.0.0.0:9091'
  buffers:
    read: 8192
    write: 8192

log:
  level: info

# Storage configuration
storage:
  encryption_key: '${STORAGE_ENCRYPTION_KEY}'
  local:
    path: /config/db.sqlite3

# LDAP authentication backend
authentication_backend:
  password_reset:
    disable: false
  ldap:
    address: 'ldap://127.0.0.1:3890'
    implementation: custom
    timeout: 5s
    start_tls: false
    base_dn: 'dc=authelia,dc=com'
    additional_users_dn: 'ou=people'
    users_filter: '(&(|(uid={username_attribute})(mail={username_attribute})(uid={input}))(objectClass=person))'
    additional_groups_dn: 'ou=groups'
    groups_filter: '(member={dn})'
    attributes:
      group_name: cn
      mail: mail
      display_name: displayName
    user: 'uid=admin,ou=people,dc=authelia,dc=com'
    password: 'Avo-029466372'

# Session configuration
session:
  name: auth_session
  secret: '${SESSION_SECRET}'
  inactivity: '5m'
  expiration: '1h'
  remember_me: '1M'
  cookies:
    - name: auth_session
      domain: 'localhost.sslip.io'
      same_site: 'lax'
      authelia_url: 'https://auth.localhost.sslip.io:8443'
    - name: auth_session_prod
      domain: 'avocado4ai.com'
      same_site: 'lax'
      authelia_url: 'https://auth.avocado4ai.com'

# Identity validation
identity_validation:
  reset_password:
    jwt_secret: '${JWT_SECRET}'

# Notification configuration
notifier:
  filesystem:
    filename: /config/notification.txt

# Access control
access_control:
  default_policy: deny # ברירת מחדל - אין גישה לאף אחד
  rules:
    # פטור מאימות לפורטל של Authelia עצמו
    - domain: 
        - "auth.localhost.sslip.io"
        - "auth.avocado4ai.com"
      policy: bypass

    # חוקי גישה ל-CMS של Koci
    - domain: "koci.avocado4ai.com"
      subject: "group:koci_admins"
      policy: one_factor

    # חוקי גישה ל-CMS של Koci (Legacy)
    - domain: "*.koci.avocado4ai.com"
      subject: "group:koci_admins"
      policy: one_factor

    # חוקי גישה ל-CMS של Raya
    - domain: "raya-v1.avocado4ai.com"
      subject: "group:raya_admins"
      policy: one_factor

    # חוקי גישה ל-CMS של Raya (Legacy)
    - domain: "*.raya.avocado4ai.com"
      subject: "group:raya_admins"
      policy: one_factor

    # חוקי גישה ל-CMS של Orly
    - domain: "orly.avocado4ai.com"
      subject: "group:orly_admins"
      policy: one_factor

    # חוקי גישה ל-CMS של Orly (Legacy)
    - domain: "*.orly.avocado4ai.com"
      subject: "group:orly_admins"
      policy: one_factor

    # חוקי גישה ל-CMS של Kochi (mediation-newpath)
    - domain: "mediation-newpath.co.il"
      subject: "group:kochi_cms_admins"
      policy: one_factor
    - domain: "www.mediation-newpath.co.il"
      subject: "group:kochi_cms_admins"
      policy: one_factor

    # חוקי גישה ל-CMS של Abba-Das
    - domain: "abba-das.vercel.app"
      subject: "group:abba-das_admins"
      policy: one_factor

    # גישה כללית למנהלי מערכת לכל הדומיינים
    - domain: "*.avocado4ai.com"
      subject: "group:admins"
      policy: two_factor # אבטחה כפולה למנהלים

# TOTP Configuration
totp:
  disable: true
  issuer: 'auth.localhost.sslip.io'

# WebAuthn Configuration
webauthn:
  disable: false
  timeout: '60s'

